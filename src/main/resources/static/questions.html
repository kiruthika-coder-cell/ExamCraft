<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExamCraft - Questions</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .questions-section {
            padding: 40px 7%;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .question-header h1 {
            margin-bottom: 5px;
        }

        .add-btn {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .filters input,
        .filters select {
            padding: 11px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #171a2b;
            color: white;
        }

        #questionList {
            display: grid;
            gap: 18px;
        }

        .question-card {
            background: #171a2b;
            border: 1px solid #292d45;
            border-radius: 15px;
            padding: 22px;
        }

        .question-card h3 {
            margin-top: 0;
        }

        .question-card p {
            margin: 8px 0;
        }

        .question-meta {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            background: #252a43;
            font-size: 13px;
        }

        .delete-btn {
            margin-top: 15px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #d9534f;
            color: white;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 40px;
            opacity: 0.7;
        }

    </style>

</head>

<body>

<nav>

    <div class="brand">

        <div class="brand-logo">E</div>

        <div class="brand-name">
            ExamCraft
        </div>

    </div>

    <div class="nav-links">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="questions.html" class="active">
            Questions
        </a>

        <a href="generate.html">
            Generate Test
        </a>

        <a href="test-paper.html">
            Test Papers
        </a>

        <a href="attempts.html">
            Attempts
        </a>

        <a href="analytics.html">
            Analytics
        </a>

        <a href="login.html" class="profile">
            Logout
        </a>

    </div>

</nav>


<section class="questions-section">


    <div class="question-header">

        <div>

            <h1>
                Question Bank
            </h1>

            <p>
                All questions stored in ExamCraft
            </p>

        </div>

        <button
                class="add-btn"
                onclick="addQuestion()">

            + Add Question

        </button>

    </div>


    <!-- FILTERS -->

    <div class="filters">

        <input
                type="text"
                id="searchInput"
                placeholder="Search questions..."
                onkeyup="filterQuestions()"
        >

        <select
                id="difficultyFilter"
                onchange="filterQuestions()">

            <option value="All">
                All Difficulty
            </option>

            <option value="Easy">
                Easy
            </option>

            <option value="Medium">
                Medium
            </option>

            <option value="Hard">
                Hard
            </option>

        </select>

    </div>


    <!-- QUESTION LIST -->

    <div id="questionList">

        <div class="empty">
            Loading questions...
        </div>

    </div>


</section>


<script>

    let allQuestions = [];


    // LOAD QUESTIONS

    async function loadQuestions() {

        try {

            const response =
                await fetch("/questions");

            if (!response.ok) {

                throw new Error(
                    "Failed to load questions"
                );

            }

            allQuestions =
                await response.json();

            displayQuestions(allQuestions);

        }

        catch (error) {

            console.error(error);

            document.getElementById(
                "questionList"
            ).innerHTML = `

                <div class="empty">

                    Unable to load questions.

                </div>

            `;

        }

    }


    // DISPLAY QUESTIONS

    function displayQuestions(questions) {

        const questionList =
            document.getElementById(
                "questionList"
            );

        questionList.innerHTML = "";


        if (questions.length === 0) {

            questionList.innerHTML = `

                <div class="empty">

                    No questions found.

                </div>

            `;

            return;

        }


        questions.forEach(
            (question, index) => {

                const card =
                    document.createElement("div");

                card.className =
                    "question-card";


                card.innerHTML = `

                    <h3>
                        Question ${index + 1}
                    </h3>

                    <p>
                        <strong>
                            ${question.questionText}
                        </strong>
                    </p>

                    <p>
                        A. ${question.optionA}
                    </p>

                    <p>
                        B. ${question.optionB}
                    </p>

                    <p>
                        C. ${question.optionC}
                    </p>

                    <p>
                        D. ${question.optionD}
                    </p>


                    <div class="question-meta">

                        <span class="badge">
                            Difficulty:
                            ${question.difficulty}
                        </span>

                        <span class="badge">
                            Unit:
                            ${question.unit}
                        </span>

                        <span class="badge">
                            Topic:
                            ${question.topic}
                        </span>

                    </div>


                    <button
                        class="delete-btn"
                        onclick="deleteQuestion(${question.id})">

                        Delete

                    </button>

                `;


                questionList.appendChild(card);

            }
        );

    }


    // SEARCH + FILTER

    function filterQuestions() {

        const search =
            document.getElementById(
                "searchInput"
            ).value.toLowerCase();


        const difficulty =
            document.getElementById(
                "difficultyFilter"
            ).value;


        const filtered =
            allQuestions.filter(
                question => {

                    const matchesSearch =
                        question.questionText
                            .toLowerCase()
                            .includes(search);


                    const matchesDifficulty =
                        difficulty === "All" ||
                        question.difficulty === difficulty;


                    return (
                        matchesSearch &&
                        matchesDifficulty
                    );

                }
            );


        displayQuestions(filtered);

    }


    // DELETE QUESTION

    async function deleteQuestion(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this question?"
            );


        if (!confirmDelete) {

            return;

        }


        try {

            const response =
                await fetch(
                    `/questions/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            if (response.ok) {

                alert(
                    "Question deleted successfully!"
                );

                loadQuestions();

            }

            else {

                alert(
                    "Unable to delete question."
                );

            }

        }

        catch (error) {

            console.error(error);

            alert(
                "Server error."
            );

        }

    }


    // ADD QUESTION

    function addQuestion() {

        alert(
            "Add Question form will be connected next."
        );

    }


    // START

    loadQuestions();

</script>


</body>

</html>
